aid: velvet
name: Velvet
description: Velvet is a multimodal AI model R&D company (the "multimodal data lab")
  based in San Francisco and backed by Y Combinator's Fall 2025 batch. It partners
  with frontier AI labs and enterprises to build state-of-the-art video datasets and
  evaluation frameworks that improve models' spatial reasoning and interactive, low-latency
  capabilities. Velvet operates an invite-only platform for sourcing and contributing
  multimodal training data, with contributor payouts via Stripe and Wise. It was founded
  by Lucas Mantovani (CEO, formerly video data at Meta FAIR) and Lucas Tucker (CTO,
  formerly Adobe). As of this enrichment pass the company publishes no public API,
  developer documentation, or SDK.
